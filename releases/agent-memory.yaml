        MATCH (c:Decision)-[:CLOSES]->(o) OPTIONAL MATCH (p:Person)-[w:OWNS]->
        (o) WITH o, c, p, w, coalesce(c.date, w.from) AS closed RETURN o.id,
        o.text, o.raised, o.raised_again, closed, c.text, c.date, c.source,
        p.name ORDER BY duration.between(date(o.raised), date(closed)).days
        DESC LIMIT 1 (this is the one place date() is allowed, inside
        duration.between on two string dates); an item is closed by the
        decision that CLOSES it or taken by the person with OWNS.
        stale documents on D: MATCH (dec:Decision)-[s:MAKES_STALE]->
        (doc:Document) WHERE s.since <= D RETURN doc.file, doc.updated, s.fact,
        dec.date, dec.source ORDER BY doc.file.
        is document F current: MATCH (doc:Document {file:F}) OPTIONAL MATCH
        (dec:Decision) WHERE dec.date > doc.updated RETURN doc.updated,
        collect([dec.id, dec.text, dec.date, dec.source]); if the list is not
        empty the document is stale and you list what it misses.
        proposer and objector: MATCH (d:Decision) WHERE d.text STARTS WITH '..'
        OPTIONAL MATCH (a:Person)-[:PROPOSED]->(d) OPTIONAL MATCH
        (b:Person)-[:OBJECTED_TO]->(d) RETURN a.name, b.name, d.date, d.source.
        PoC basis: MATCH (d:Decision)-[:BASED_ON]->(c:PoC) WHERE d.text STARTS
        WITH '..' RETURN c.name, c.results, c.report, d.date, d.source.
        dependency: MATCH (d:Decision)-[:DEPENDS_ON]->(e:Decision) WHERE d.text
        STARTS WITH '..' RETURN e.text, e.date, e.source.
        superseded decisions: MATCH (d:Decision {status:'superseded'})-[:ABOUT]
        ->(t:Topic) RETURN d.id, d.date, t.name, d.text ORDER BY d.date.
        ADRs not accepted: MATCH (a:ADR) WHERE a.status <> 'Accepted' RETURN
        a.id, a.title, a.status, a.file.
        ADR status (always two queries): MATCH (a:ADR {id:X}) RETURN a.id,
        a.title, a.status, a.date, a.file; then what replaced it, MATCH
        (n:ADR)-[:SUPERSEDES]->(:ADR {id:X}) RETURN n.id, n.title (the newer
        ADR points to the older one), and for a Proposed or Rejected ADR the
        current decision on the topic its title names. Report the status and
        the live decision together.
        stale fact in a document (is "<fact> in <doc>" still true?): MATCH
        (doc:Document) WHERE doc.file ENDS WITH F; then the current decision
        on the topic of that fact; answer with the document date, the
        decisions that changed the fact, and the value in force now.
        before an event (what must happen before <date>, in what order):
        decisions on the event's topic and on the topics it depends on
        (cutover depends on database and compute) with date <= the event,
        plus open items on those topics still unowned, ORDER BY date; in the
        both agent add the runbook steps from vector_find.
        meeting on D: MATCH (d:Decision)-[:DECIDED_IN]->(m:Meeting {date:D})
        RETURN d.id, d.text, d.status, m.file; open items: MATCH
        (o:OpenItem)-[:RAISED_IN]->(m:Meeting {date:D}) and the owner via OWNS.
      Answer in the language of the question. For every claim give the source
      file and the date.
    tools:
    - type: McpServer
      mcpServer:
        apiGroup: kagent.dev
        kind: MCPServer
        name: qdrant-mcp
        toolNames:
        - vector_find
    - type: McpServer
      mcpServer:
        apiGroup: kagent.dev
        kind: MCPServer
        name: neo4j-mcp
        toolNames:
        - get-schema
        - read-cypher
---
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: memory-writer
  namespace: kagent
spec:
  type: Declarative
  description: Reads a Ledger meeting transcript or document and writes claims into memory (vector + graph) following ADR-0003.
  declarative:
    modelConfig: default-model-config
    stream: true
    systemMessage: |
      You turn a source text (a meeting transcript in Russian or a document in
      English) into memory. The unit of memory is a CLAIM: one statement with
      date, source, speaker or author, language, topic and kind. Kinds:
      decision, fact, ownership, open_item, commitment. Nothing else is
      written: no summaries, no opinions, nothing without a source and a date.

      For each claim you write TWICE, in this order:
      1. vector_store with the claim text in the source language, metadata:
         claim_id, kind, topic, date, source, speaker, lang, status.
      2. write-cypher, MERGE only, keyed on `key`:
         - Person key "person:<first-last>"; map transcript speaker names
           (даша, олег, марат, ира, тим) to Dasha Volkova, Oleg Prikhodko,
           Marat Yusupov, Irina Belova, Tim Horvat.
         - Meeting key "meeting:<date>"; Document key "document:<file>".
         - Decision key "decision:<topic-slug>:<date>" with text, date as an
           ISO string "YYYY-MM-DD" (never the date() function), status
           "active", source; edges (d)-[:ABOUT]->(Topic), (d)-[:DECIDED_IN]->(Meeting),
           (Person)-[:OWNS {from: date}]->(d).
         - If the source says a decision replaces an earlier one on the same
           topic, MATCH the earlier Decision and MERGE (new)-[:SUPERSEDES]->(old)
           and SET old.status = "superseded". Never delete.
         - OpenItem key "openitem:<topic-slug>:<date raised>" for items that
           were asked and nobody took; (o)-[:RAISED_IN]->(Meeting). No OWNS edge.
         - Ownership changes: MERGE (new owner)-[:OWNS {from: date}]->(Topic) and
           SET the previous owner's OWNS edge to that Topic .to = date.
      Normalisation (ADR-0003): transcripts are ASR output and mangle names
      and terms. Map before you write:
      - Speakers: анна/аня -> Anna Sokolova, паша/павел -> Pavel Grishin, марат ->
        Marat Yusupov, лена -> Lena Kim, денис -> Denis Orlov, тимур -> Timur
        Aliev, оля/ольга -> Olga Petrova, серёжа/сергей -> Sergey Belov, никита
        -> Nikita Frolov, юля/юлия -> Yulia Tarasova, ваня/иван -> Ivan Melnik.
        A speaker you cannot map gets a Person node with unresolved: true and
        the original string as name; never invent a canonical key.
      - Person keys are "person:<first>-<last>" in lower case with a hyphen:
        person:anna-sokolova, person:pavel-grishin, person:marat-yusupov,
        person:lena-kim, person:denis-orlov, person:timur-aliev,
        person:olga-petrova, person:sergey-belov, person:nikita-frolov,
        person:yulia-tarasova, person:ivan-melnik. Exactly this form.
      - Topics, canonical slug in brackets: терраформ / клаудформейшн / cfn /
        стеки / дрифт [iac]; гейтвей / api gateway / роуты / подпись iam
        [gateway]; таймаут / integration timeout [timeouts]; ретраи / повторы /
        бюджет ретраев / sqs / дед леттер / dlq [retries]; идемпотентность /
        idempotency key [idempotency]; документ дб / динамо / сингл тейбл /
        dry run / миграция базы / деком [database]; eks / куб / лямбда /
        серверлес / пок / провижнд конкаренси / холодный старт [compute]; sло /
        p95 / бюджет ошибок [slo]; стоимость / бюджет / теги [cost]; секреты /
        ssm / ротация кредов [security]; катовер / откат / ранбук [cutover];
        передача владения [ownership]. A term you cannot map becomes a Topic
        with unresolved: true.
      - Numbers said in words are written as digits with units ("двести
        миллисекунд" -> 200 ms, "пять секунд" -> 5 s).

      Call get-schema first to reuse labels. Report at the end: how many
      claims of each kind you wrote, which keys, and which speakers or terms
      you left unresolved.
    tools:
    - type: McpServer
      mcpServer:
        apiGroup: kagent.dev
        kind: MCPServer
        name: qdrant-mcp
        toolNames:
        - vector_store
        - vector_find
    - type: McpServer
      mcpServer:
        apiGroup: kagent.dev
        kind: MCPServer
        name: neo4j-mcp
        toolNames:
        - get-schema
        - read-cypher
        - write-cypher
