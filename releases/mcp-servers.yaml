# MCP servers run by kagent's kmcp controller. kmcp creates a Service named
# after the MCPServer and adapts stdio servers to streamable HTTP.
---
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: neo4j-mcp
  namespace: kagent
spec:
  transportType: stdio
  stdioTransport: {}
  deployment:
    image: neo4j/mcp:v1.6.0
    cmd: /app/neo4j-mcp
    env:
      NEO4J_MCP_URI: bolt://neo4j.neo4j:7687
      NEO4J_MCP_USERNAME: neo4j
      # Matches releases/neo4j.yaml.
      NEO4J_MCP_PASSWORD: abox-neo4j
      NEO4J_MCP_DATABASE: neo4j
      NEO4J_MCP_READ_ONLY: "false"
      NEO4J_MCP_TELEMETRY: "false"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
---
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: qdrant-mcp
  namespace: kagent
spec:
  transportType: stdio
  stdioTransport: {}
  deployment:
    # Ours; scaffolded with `kmcp init go`, source in mcp/qdrant-mcp. Replaces
    # mcp-server-qdrant, which could only embed in-process with fastembed and
    # was OOMKilled doing it.
    image: ghcr.io/den-vasyliev/abox/qdrant-mcp:0.4.0
    cmd: /app/server
    env:
      # Any OpenAI-compatible /v1/embeddings route. The standalone llama.cpp
      # Deployment, serving nomic-embed-text-v1.5 as f16 at 8 slots x 2048 ctx.
      # This is the starting point of the migration exercise; the other route is
      # llm-d's decode Service:
      #
      #   http://llm-d-embedding.llm-d:8000
      #
      # hit directly rather than through the EPP, whose scorers are built for
      # generation traffic, not a pooling runner's single-shot embed. Direct
      # means no model-based routing, so EMBEDDINGS_MODEL stays unset there too:
      # llama.cpp ignores it and serves the one GGUF it was given. A managed
      # endpoint would need EMBEDDINGS_MODEL and EMBEDDINGS_API_KEY -- see
      # mcp/qdrant-mcp/README.md, "Switching the embeddings backend".
      #
      # chat returns 501 against either: both are started with --embeddings and
      # have no generation head.
      EMBEDDINGS_BASE_URL: http://llama-cpp-embeddings.llama-cpp:8090
      # vector_store / vector_find embed through the same endpoint, so the
      # agent's memory lands in the vector space the gateway serves. The
      # collection is named for that space. llm-d serves the same model at Q8_0
      # rather than f16 -- same 768 dims, different kernels -- so the two routes
      # are two spaces and the vectors do not transfer. Repointing
      # EMBEDDINGS_BASE_URL is therefore a re-embed, not a copy.
      QDRANT_URL: http://qdrant.qdrant:6333
      # TASK-0003 (harness-engineering): the standalone llama.cpp route now
      # serves bge-m3, 1024 dims, so this is a new collection -- the nomic one
      # (abox-nomic, 768 dims) cannot hold these vectors. Same chunk list as
      # the two MiniLM collections below; the three are compared side by side.
      QDRANT_COLLECTION: manifests-bge-m3
      # bge-m3 is symmetric: no instruction prefix on either side. The server
      # reads these with LookupEnv, so an empty value is honoured and turns the
      # nomic defaults ("search_document: " / "search_query: ") off.
      EMBEDDINGS_DOCUMENT_PREFIX: ""
      EMBEDDINGS_QUERY_PREFIX: ""
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 500m
        memory: 256Mi
---
# The official qdrant MCP (github.com/qdrant/mcp-server-qdrant), twice, for the
# TASK-0003 comparison. It embeds in-process with FastEmbed and exposes
# qdrant-store / qdrant-find; the model is chosen per instance by
# EMBEDDING_MODEL and each instance owns one collection via COLLECTION_NAME.
#
# This is the server the branch replaced with mcp/qdrant-mcp after it was
# OOMKilled embedding in-process at a 2Gi limit on a 2-core Codespace. It is
# back as the comparison baseline, on a 4-core Codespace, with 3Gi. The first
# start downloads the ONNX model from Hugging Face, so readiness takes a few
# minutes and needs egress (make fix-egress).
#
# Upstream publishes no image, only a PyPI package -- run it with uvx.
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: qdrant-official-minilm-l6
  namespace: kagent
spec:
  transportType: stdio
  stdioTransport: {}
  deployment:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    cmd: uvx
    args:
      - mcp-server-qdrant
    env:
      QDRANT_URL: http://qdrant.qdrant:6333
      COLLECTION_NAME: manifests-minilm-l6
      EMBEDDING_PROVIDER: fastembed
      # English-only, 384 dims, 256-token input. The lab's reference model.
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      FASTMCP_LOG_LEVEL: INFO
      # The defaults describe a personal memory. These describe the data.
      TOOL_STORE_DESCRIPTION: "Store one chunk of a Kubernetes manifest (YAML text with its leading comments) in the manifests collection. Metadata must carry file, kind, name and namespace so a hit can be traced back to the object."
      TOOL_FIND_DESCRIPTION: "Semantic search over chunks of the cluster's Kubernetes manifests (releases/*.yaml). Pass the question as the query. Returns the matching chunks with their file, kind, name and namespace."
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 3Gi
---
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: qdrant-official-minilm-ml
  namespace: kagent
spec:
  transportType: stdio
  stdioTransport: {}
  deployment:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    cmd: uvx
    args:
      - mcp-server-qdrant
    env:
      QDRANT_URL: http://qdrant.qdrant:6333
      COLLECTION_NAME: manifests-minilm-ml
      EMBEDDING_PROVIDER: fastembed
      # Multilingual sibling, 50+ languages incl. Russian, 384 dims, but only
      # a 128-token input window: anything longer is truncated by the model.
      EMBEDDING_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      FASTMCP_LOG_LEVEL: INFO
      TOOL_STORE_DESCRIPTION: "Store one chunk of a Kubernetes manifest (YAML text with its leading comments) in the manifests collection. Metadata must carry file, kind, name and namespace so a hit can be traced back to the object."
      TOOL_FIND_DESCRIPTION: "Semantic search over chunks of the cluster's Kubernetes manifests (releases/*.yaml). Pass the question as the query, in the language it was asked. Returns the matching chunks with their file, kind, name and namespace."
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 3Gi
