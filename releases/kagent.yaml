apiVersion: v1
kind: Namespace
metadata:
  name: kagent
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kagent
  namespace: flux-system
spec:
  interval: 1h
  url: oci://ghcr.io/kagent-dev/kagent/helm/kagent
  ref:
    tag: "0.10.1"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent
  namespace: kagent
spec:
  interval: 1h
  releaseName: kagent
  # Flux appends the OCIRepository artifact digest to the chart version as
  # semver build metadata, so Helm sees 0.10.1+dc7fc6109072. kagent's Chart.yaml
  # has no appVersion, so app.kubernetes.io/version falls back to .Chart.Version
  # and inherits the '+', which Kubernetes rejects as a label value:
  #
  #   ServiceAccount "kagent-controller" is invalid: metadata.labels:
  #   Invalid value: "0.10.1+dc7fc6109072"
  #
  # Subcharts are unaffected -- they carry their own Chart.Version -- which is
  # why tools, kmcp and grafana-mcp installed while the controller, UI,
  # postgresql, ModelConfig and RemoteMCPServer did not. All 21 broken objects
  # carry app.kubernetes.io/name=kagent, so rewrite the label on those.
  #
  # This is not visible in a local `helm template`: the build metadata is added
  # by Flux, not by the chart.
  postRenderers:
  - kustomize:
      patches:
      - patch: |
          - op: add
            path: /metadata/labels/app.kubernetes.io~1version
            value: "0.10.1"
        target:
          labelSelector: app.kubernetes.io/name=kagent
  dependsOn:
    - name: kagent-crds
      namespace: kagent
  chartRef:
    kind: OCIRepository
    name: kagent
    namespace: flux-system
  install:
    createNamespace: true
  values:
    # Image tags must be set explicitly. Left unset, the chart falls back to
    # .Chart.Version for the image reference, which Flux has made
    # 0.10.1+dc7fc6109072 -- and '+' is not legal in a tag:
    #
    #   Failed to apply default image tag
    #   "ghcr.io/kagent-dev/kagent/controller:0.10.1+dc7fc6109072":
    #   invalid reference format ... InvalidImageName
    #
    # The chart sanitises the '+' for helm.sh/chart but not for the image tags
    # or app.kubernetes.io/version, which the postRenderer above handles.
    # Postgres and the subcharts pin their own images and are unaffected.
    tag: "0.10.1"
    controller:
      image:
        tag: "0.10.1"
    ui:
      image:
        tag: "0.10.1"
    # 0.10.x drops the per-tool toggles that used to disable querydoc, so the
    # kagent-tools subchart is left at its default.
    istio-agent:
      enabled: false
    cilium-policy-agent:
      enabled: false
    cilium-manager-agent:
      enabled: false
    cilium-debug-agent:
      enabled: false
    providers:
      default: openAI
      openAI:
        apiKey: OPENAI_API_KEY
    # --- o11y lab: kagent inside the observability stack -------------------
    # Every agent run, LLM call and tool call becomes a span. The OTLP/gRPC
    # exporter points at the bridge collector in releases/mlflow-otel-
    # collector.yaml, which routes by resource attributes into MLflow
    # experiments (see the kagent route added there); Phoenix stays as the
    # agentgateway-llm tracing target.
    otel:
      tracing:
        enabled: true
        exporter:
          otlp:
            endpoint: otel-collector.mlflow.svc.cluster.local:4317
            protocol: grpc
            insecure: true
    # The built-in promql-agent and observability-agent reach Prometheus and
    # Grafana through kagent-tools and grafana-mcp. Chart defaults point at
    # prometheus.kagent / grafana.kagent, which do not exist here; the OTel
    # demo's own Prometheus and Grafana (releases/opentelemetry-demo.yaml,
    # fullnameOverride prometheus / grafana in namespace otel-demo) are the
    # metrics backend for this lab.
    kagent-tools:
      tools:
        prometheus:
          url: "prometheus.otel-demo.svc.cluster.local:9090"
        grafana:
          url: "http://grafana.otel-demo.svc.cluster.local:80"
    grafana-mcp:
      grafana:
        url: "http://grafana.otel-demo.svc.cluster.local:80/api"
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: kagent
  namespace: kagent
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: kagent
  to:
  - group: ""
    kind: Service
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kagent
  namespace: kagent
spec:
  parentRefs:
  - name: agentgateway-external
    namespace: agentgateway-system
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api
    backendRefs:
    - name: kagent-controller
      namespace: kagent
      port: 8083
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: kagent-ui
      namespace: kagent
      port: 8080
