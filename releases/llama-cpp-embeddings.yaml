# llama.cpp serving BAAI bge-m3 (F16 GGUF) -- the standalone embeddings route.
#
# Switched from nomic-embed-text-v1.5 for TASK-0003 / ADR-0001 in the
# harness-engineering lab: bge-m3 is the chosen model for English docs plus
# Russian transcripts. Parameters follow TASK-0001's contract exactly so that
# vectors from a laptop (same GGUF, same flags) and from this pod are
# interchangeable:
#
#   --embeddings --pooling cls --embd-normalize 2
#   --ctx-size 8192 per slot, --batch-size / --ubatch-size 8192
#   over-length input is an error, never a truncation
#
# The GGUF is fetched by an init container into an emptyDir and its sha256 is
# checked before llama-server starts. That is the quick path for the lab: the
# proper one is a baked image (images/bge-m3-embed, TASK-0002), which avoids
# a 1.1 GB download on every reschedule. Keep the hash in one place -- it is
# TASK-0001's -- if you change the file.
apiVersion: v1
kind: Namespace
metadata:
  name: llama-cpp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp-embeddings
  namespace: llama-cpp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llama-cpp-embeddings
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llama-cpp-embeddings
    spec:
      volumes:
        - name: models
          emptyDir: {}
      initContainers:
        - name: fetch-model
          image: curlimages/curl:8.11.0
          command: ["/bin/sh", "-ec"]
          args:
            - |
              cd /models
              if [ ! -s model.gguf ]; then
                curl -fL --retry 5 --retry-delay 3 --retry-connrefused \
                  -o model.gguf \
                  https://huggingface.co/gpustack/bge-m3-GGUF/resolve/main/bge-m3-FP16.gguf
              fi
              echo "daec91ffb5dd0c27411bd71f29932917c49cf529a641d0168496c3a501e3062c  model.gguf" | sha256sum -c
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: llama-server
          # Same build line as the laptop install in TASK-0001 (0.6.0, b11429).
          # Pin by digest once the pod has pulled it: kubectl get pod -o
          # jsonpath='{.status.containerStatuses[0].imageID}'.
          image: ghcr.io/ggml-org/llama.cpp:server-b11429
          # No command: -- the upstream ENTRYPOINT is the llama-server binary
          # and its path varies between image variants.
          args:
            - --host
            - 0.0.0.0
            - --port
            - "8090"
            - --embeddings
            - --pooling
            - cls
            - --embd-normalize
            - "2"
            # Two slots of 8192: --ctx-size is divided by --parallel. The
            # micro-batch must hold a whole slot, because a pooled embedding
            # has to fit in one; it is the real per-request ceiling.
            - --ctx-size
            - "16384"
            - --parallel
            - "2"
            - --batch-size
            - "8192"
            - --ubatch-size
            - "8192"
            # bge-m3 is an XLM-R encoder: a non-causal 8192-token micro-batch
            # materialises the full attention matrix without this. Numerically
            # it is the same computation; the parity check in TASK-0003
            # confirms against the laptop vectors (which run without it).
            - --flash-attn
            - "on"
            - --model
            - /models/model.gguf
            - --metrics
          ports:
            - containerPort: 8090
              name: http
          volumeMounts:
            - name: models
              mountPath: /models
          # The GGUF is mmap'd and loads in seconds; the budget covers the init
          # container's download, which is accounted separately, so this only
          # has to cover scheduling and model load: 5s x 24 = 2 min.
          startupProbe:
            httpGet:
              path: /health
              port: 8090
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            periodSeconds: 30
          # Starting values, to be replaced by measurements (TASK-0002 step 9):
          # 1.16 GB mmap'd weights plus the compute buffers for an 8192-token
          # micro-batch. Idle RSS on a laptop was 1.7 GB with the same flags.
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "3"
              memory: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: llama-cpp-embeddings
  namespace: llama-cpp
spec:
  selector:
    app.kubernetes.io/name: llama-cpp-embeddings
  ports:
    - name: http
      port: 8090
      targetPort: 8090
      protocol: TCP
---
# External:   http://<gateway-ip>/llamacpp/v1/embeddings
# In-cluster: http://llama-cpp-embeddings.llama-cpp:8090/v1/embeddings
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: llama-cpp-embeddings
  namespace: llama-cpp
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: llama-cpp
  to:
  - group: ""
    kind: Service
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llama-cpp-embeddings
  namespace: llama-cpp
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-external
      namespace: agentgateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /llamacpp
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: llama-cpp-embeddings
          port: 8090
